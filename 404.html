<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Aldrich De Leon</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/WebsiteAldrichCV.github.io/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap"
    />
    <style>
      :root {
        --bg: #080b14;
        --text: #eef1fa;
        --muted: #97a1bd;
        --border: rgba(255, 255, 255, 0.09);
        --brand-1: #6366f1;
        --brand-2: #ec4899;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      .wrap {
        max-width: 480px;
      }
      .code {
        font-family: Outfit, system-ui, sans-serif;
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-family: Outfit, system-ui, sans-serif;
        font-size: 1.75rem;
        margin: 0.75rem 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin-bottom: 2rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.8rem 1.6rem;
        border-radius: 99px;
        background: linear-gradient(135deg, #4f46e5, #db2777);
        color: #fff;
        font-family: Outfit, system-ui, sans-serif;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.25s ease;
      }
      a.btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>This page took a wrong turn</h1>
      <p>The link you followed doesn't exist — but there's plenty to explore back home.</p>
      <a class="btn" href="/WebsiteAldrichCV.github.io/">Back to portfolio</a>
    </div>
  </body>
</html>
